name: Duello
options:
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
  # generateEmptyDirectories: true kapalı — bundled içerik klasörleri zaten dolu

configs:
  Debug: debug
  Release: release

settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1"          # sadece iPhone — playbook Bölüm 1
    IPHONEOS_DEPLOYMENT_TARGET: "16.0"
    MARKETING_VERSION: "1.0"
    # Apple Connect'e (1.0) build 2 olarak yüklenmiş ve reddedilmişti — her yeni
    # yükleme benzersiz bir build numarası istiyor, o yüzden burayı da artırdık.
    CURRENT_PROJECT_VERSION: "3"
    # DEVELOPMENT_TEAM burada YOK — Xcode'da Signing & Capabilities'den elle
    # seçilmeli (playbook Bölüm 4 checklist), CLI/XcodeGen headless yapamaz.
  configs:
    Debug:
      # XcodeGen'in ürettiği "Debug" konfigürasyonu Xcode'un yeni-proje
      # şablonunun aksine bunu OTOMATİK eklemiyor — eklenmeden `#if DEBUG` ile
      # sarılmış hiçbir kod (ör. ekran görüntüsü otomasyonu, RootView) derlenmiyordu.
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG

targets:
  Duello:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: Duello
    settings:
      base:
        # Bundle ID: İLK App Store Connect kaydından sonra ASLA değiştirme
        # (playbook Bölüm 1). `com.duello.app` Apple Developer'da zaten alınmış
        # çıktı (bundle ID'ler tüm geliştirici hesapları arasında global olarak
        # benzersiz) — marka adıyla eşleşen `com.reactduel.app`'e geçildi.
        PRODUCT_BUNDLE_IDENTIFIER: com.reactduel.app
        # Üstteki `settings.base.TARGETED_DEVICE_FAMILY: "1"` (proje/dosyanın
        # başı) sadece PROJE seviyesinde uygulanıyor — XcodeGen, application
        # tipi bir target oluştururken burada AÇIKÇA verilmediği sürece kendi
        # varsayılanı olan "1,2" (iPhone+iPad, universal) değerini TARGET
        # seviyesinde yazıyor ve bu, App Store Connect'in gördüğü asıl değer.
        # Bu yüzden App Store Connect "13-inch iPad ekran görüntüsü yükle"
        # diye tutturuyordu — uygulama iPad'de de çalışır görünüyordu, oysa
        # tek yönlü (portrait) kamera deneyimi hiç iPad için tasarlanmadı.
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_PREVIEWS: true
    info:
      path: Duello/Info.plist
      properties:
        CFBundleDisplayName: ReactDuel
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIRequiresFullScreen: true
        NSCameraUsageDescription: >-
          ReactDuel, tepkini kaydedip video oluşturman için ön kameraya ihtiyaç duyar.
          Kayıt sadece sen başlattığında yapılır ve cihazından hiçbir yere otomatik
          gönderilmez.
        NSMicrophoneUsageDescription: >-
          Kaydettiğin videoya sesini eklemek için mikrofona ihtiyaç duyarız.
        NSPhotoLibraryAddUsageDescription: >-
          Oluşturduğun videoyu fotoğraf kütüphanene kaydedebilmek için izin gerekir.
    scheme:
      testTargets:
        - DuelloTests
      gatherCoverageData: true

  DuelloTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: DuelloTests
    dependencies:
      - target: Duello
    settings:
      base:
        GENERATE_INFOPLIST_FILE: true

# NOT: Ayrı bir top-level `schemes:` bloğu YOK — Duello hedefinin altındaki
# `scheme:` kısayolu zaten "Duello" adında, DuelloTests'i de test eden bir
# şema üretiyor. İkisini birden tanımlamak aynı isimde çakışan bir şema
# üretirdi (bu, ilk taslakta yakalanıp düzeltilen bir hataydı — bkz. NOTES.md).
