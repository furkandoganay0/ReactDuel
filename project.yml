name: Duello
options:
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
  # generateEmptyDirectories: true kapalı — bundled içerik klasörleri zaten dolu

configs:
  Debug: debug
  Release: release

settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1"          # sadece iPhone — playbook Bölüm 1
    IPHONEOS_DEPLOYMENT_TARGET: "16.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    # DEVELOPMENT_TEAM burada YOK — Xcode'da Signing & Capabilities'den elle
    # seçilmeli (playbook Bölüm 4 checklist), CLI/XcodeGen headless yapamaz.

targets:
  Duello:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: Duello
    settings:
      base:
        # Bundle ID: İLK App Store Connect kaydından sonra ASLA değiştirme
        # (playbook Bölüm 1). Şu an henüz gönderilmedi, bu değeri kilitliyoruz.
        PRODUCT_BUNDLE_IDENTIFIER: com.duello.app
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_PREVIEWS: true
    info:
      path: Duello/Info.plist
      properties:
        CFBundleDisplayName: Duello
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIRequiresFullScreen: true
        NSCameraUsageDescription: >-
          Duello, tepkini kaydedip video oluşturman için ön kameraya ihtiyaç duyar.
          Kayıt sadece sen başlattığında yapılır ve cihazından hiçbir yere otomatik
          gönderilmez.
        NSMicrophoneUsageDescription: >-
          Kaydettiğin videoya sesini eklemek için mikrofona ihtiyaç duyarız.
        NSPhotoLibraryAddUsageDescription: >-
          Oluşturduğun videoyu fotoğraf kütüphanene kaydedebilmek için izin gerekir.
    scheme:
      testTargets:
        - DuelloTests
      gatherCoverageData: true

  DuelloTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: DuelloTests
    dependencies:
      - target: Duello
    settings:
      base:
        GENERATE_INFOPLIST_FILE: true

# NOT: Ayrı bir top-level `schemes:` bloğu YOK — Duello hedefinin altındaki
# `scheme:` kısayolu zaten "Duello" adında, DuelloTests'i de test eden bir
# şema üretiyor. İkisini birden tanımlamak aynı isimde çakışan bir şema
# üretirdi (bu, ilk taslakta yakalanıp düzeltilen bir hataydı — bkz. NOTES.md).
